<style>
/* Tela de despacho da loja: cabeçalho fixo com a contagem, depois as saídas por motoboy (cor = motoboy, linha = pedidos que vão juntos) e quem está na rua. */
:root {
  --bg: #eef1f4; --card: #ffffff; --ink: #141920; --muted: #5a6472; --line: #d8dde4; --soft: #f5f7f9;
  --ok: #17703f; --ok-bg: #dff2e6; --warn: #8a5a0b; --warn-bg: #fbedd2; --late: #b4232b; --late-bg: #fbe1e2;
  --gelo: #0b5c86; --gelo-bg: #dcf0fa; --btn: #141920; --btn-ink: #ffffff; --pin-ink: #ffffff; --logo: #141920;
  --m0: #2459d6; --m1: #b0249f; --m2: #0b8579; --m3: #d4520b; --m4: #6d3fd6; --m5: #2f7d16; --m6: #cc1f4a; --m7: #0a6aa0;
  --c-burger: #d0302f; --c-marmita: #e06d0b; --c-ze: #f0c000; --c-ze-ink: #2a2300; --c-kibon: #1d7fd6;
  --c-site: #6a2a9a; --c-anota: #2e7d32; --c-p: #5f6368; --c-bebidas: #0f766e;
  --f-txt: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-tit: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --card: #181c22; --ink: #e8ecf1; --muted: #9aa4b1; --line: #2b313a; --soft: #13171c;
    --ok: #5fd08f; --ok-bg: #16331f; --warn: #f0b75a; --warn-bg: #3a2c12; --late: #ff7a80; --late-bg: #3f1b1e;
    --gelo: #7cc8ef; --gelo-bg: #10303f; --btn: #e8ecf1; --btn-ink: #0f1216; --pin-ink: #0f1216; --logo: #ffffff;
    --m0: #6c9bff; --m1: #e57af0; --m2: #3cc9b9; --m3: #ff8f4d; --m4: #a98bff; --m5: #6fd06f; --m6: #ff6b8b; --m7: #4fb3e8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --card: #181c22; --ink: #e8ecf1; --muted: #9aa4b1; --line: #2b313a; --soft: #13171c;
  --ok: #5fd08f; --ok-bg: #16331f; --warn: #f0b75a; --warn-bg: #3a2c12; --late: #ff7a80; --late-bg: #3f1b1e;
  --gelo: #7cc8ef; --gelo-bg: #10303f; --btn: #e8ecf1; --btn-ink: #0f1216; --pin-ink: #0f1216; --logo: #ffffff;
  --m0: #6c9bff; --m1: #e57af0; --m2: #3cc9b9; --m3: #ff8f4d; --m4: #a98bff; --m5: #6fd06f; --m6: #ff6b8b; --m7: #4fb3e8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.35 var(--f-txt); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.contas { display: flex; gap: 8px; flex-wrap: wrap; }

.anotados ul { margin: 4px 0 0; padding-left: 18px; }
.motos { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; align-items: center; }
.moto { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 5px 6px 5px 12px; font-size: 15px; }

.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; align-items: start; }
.saida { background: var(--card); border: 1px solid var(--line); border-left: 8px solid var(--c); border-radius: 14px; padding: 14px 14px 12px; min-width: 0; }
.saida.agora { box-shadow: 0 0 0 2px var(--c) inset; }

.badge.depois { background: var(--soft); color: var(--muted); border: 1px solid var(--line); }

.n { width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: var(--card); font-weight: 800; display: grid; place-items: center; font-size: 17px; position: relative; z-index: 1; }
.l1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.canal.iFood-B { background: var(--c-burger); } .canal.iFood-M { background: var(--c-marmita); }
.canal.Ze { background: var(--c-ze); color: var(--c-ze-ink); } .canal.iFood-K { background: var(--c-kibon); }
.canal.CW-B, .canal.CW-M { background: var(--c-site); } .canal.Anota { background: var(--c-anota); }
.num { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.num small { font-size: 16px; font-weight: 500; color: var(--muted); }
.l2 { color: var(--muted); font-size: 15px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.l2 .semb { color: var(--warn); }
.st { font-size: 13px; font-weight: 700; border-radius: 6px; padding: 3px 7px; white-space: nowrap; margin-top: 4px; }
.st.ok { background: var(--ok-bg); color: var(--ok); } .st.late { background: var(--late-bg); color: var(--late); }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); padding: 8px 14px; font-size: 15px; font-weight: 600; }
button.forte { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }

button:focus-visible, input:focus-visible { outline: 3px solid var(--m0); outline-offset: 2px; }

.vazio { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 16px; color: var(--muted); }
.rua { display: grid; gap: 10px; }
.linha { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) auto auto; gap: 6px 14px; align-items: center; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.tempo.tarde { color: var(--late); font-weight: 700; }
.barra { grid-column: 1 / -1; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--c); }
.atencao { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; }
.atencao ul { margin: 0; padding-left: 18px; }
.atencao li { padding: 8px 0; border-bottom: 1px solid var(--line); }
.atencao li:last-child { border-bottom: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--btn); color: var(--btn-ink); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
footer { margin-top: 28px; color: var(--muted); font-size: 14px; }
.abas { display: flex; gap: 4px; margin-left: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.abas a { text-decoration: none; color: var(--muted); font-weight: 700; font-size: 15px; padding: 6px 12px; border-radius: 7px; display: flex; align-items: center; gap: 6px; }
.abas a.ativa { background: var(--btn); color: var(--btn-ink); }
.abas .alerta { background: var(--late); color: #ffffff; border-radius: 999px; padding: 0 7px; font-size: 12px; }
.lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.pessoa { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pessoa b { font: 700 19px var(--f-tit); }
.pessoa .estado { font-size: 13px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
.pessoa .estado.dentro { background: var(--ok-bg); color: var(--ok); }
.pessoa .estado.fora { background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
.pessoa .estado.anot { background: var(--warn-bg); color: var(--warn); }
.pessoa .dir { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.codigo { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--c-ze); border-radius: 12px; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.codigo code { font: 700 17px ui-monospace, "Cascadia Mono", Consolas, monospace; }
select { font: inherit; font-size: 15px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.cad { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cad input { font: inherit; font-size: 16px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); width: 220px; max-width: 100%; }
.dica { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.mapa-ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 14px 0 10px; }
.mapa-ctl .vao { flex: 1; }
.mapa-ctl .zoom { display: inline-flex; gap: 6px; flex-wrap: nowrap; }
.fil { font: inherit; font-size: 14px; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 5px 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.fil.ativo { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.fil .pt { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
svg.mapa { display: block; width: 100%; height: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; touch-action: none; cursor: grab; }
svg.mapa text { font-family: var(--f-txt); }
svg.mapa .fundo { opacity: .95; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) svg.mapa .fundo { filter: invert(.9) hue-rotate(180deg) brightness(.9); } }
:root[data-theme="dark"] svg.mapa .fundo { filter: invert(.9) hue-rotate(180deg) brightness(.9); }
svg.mapa .pino { cursor: pointer; }
svg.mapa .pino:focus-visible circle.borda { stroke: var(--ink); stroke-width: 3; }
.info-pino { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 12px; padding: 10px 14px; margin-top: 10px; }
.trajetos { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.trajetos li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.trajetos .pt { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; align-self: center; }
.quadro { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; align-items: start; }
@media (max-width: 960px) { .quadro { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .quadro { grid-template-columns: minmax(0, 1fr); } }
.col { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-height: 110px; display: grid; gap: 8px; align-content: start; }
.col > h3 { margin: 0; font: 700 17px var(--f-tit); display: flex; gap: 8px; align-items: center; }
.col.alvo, .caixa.alvo { outline: 3px dashed var(--ink); outline-offset: 2px; }
.cartao { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.cartao.sel { outline: 3px solid var(--ink); outline-offset: 1px; }
.cartao.sugerido { border-style: dashed; border-width: 2px; }
.cartao .l1 { display: flex; gap: 6px; align-items: center; font-weight: 700; flex-wrap: wrap; }
.cartao .l2 { color: var(--muted); font-size: 14px; }
.cartao .sug { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.cartao .sug .pt, .caixa .pt { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.caixa { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 12px; padding: 8px; display: grid; gap: 6px; }
.caixa > header { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
.caixa > header b { font: 700 17px var(--f-tit); }
.caixa > header .onde { color: var(--muted); font-size: 13px; }
.caixa > header .cont { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 700; }

.caixa .sugere { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pausados { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; padding: 8px; border: 1px dashed var(--line); border-radius: 8px; }

.grupo-ifood .trava-txt { margin-left: 8px; font-size: 13px; color: var(--muted); }
.cartao.trava { cursor: default; background: var(--soft); }
.tag-ifood { font-size: 12px; font-weight: 700; letter-spacing: 0.03em; border-radius: 6px; padding: 1px 6px; background: var(--c-burger); color: #fff; }
.canal.iFood-D { background: var(--c-burger); }
.fantasma { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 30; opacity: .92; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); cursor: grabbing; }
.barra-mover { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0, 0, 0, .12); padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.barra-mover .rot { font-weight: 700; margin-right: 4px; }
main.com-barra { padding-bottom: 150px; }
.logo { display: inline-block; width: 96px; height: 28px; margin-right: 10px; vertical-align: -5px; background: var(--logo);
  -webkit-mask: url(logo_osorio.png) center / contain no-repeat; mask: url(logo_osorio.png) center / contain no-repeat; }
@media (max-width: 560px) { .logo { width: 78px; height: 23px; margin-right: 8px; } }
@media (max-width: 560px) {
  .linha { grid-template-columns: minmax(0, 1fr) auto; }

}
/* Aba Painel (14/11 ~21h): colunas como o Gestor do iFood; cada moldura é um motoboy, 🔗 = pedidos que vão juntos */
.painel { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 12px; align-items: start; }
@media (max-width: 1100px) { .painel { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .painel { grid-template-columns: minmax(0, 1fr); } }
.pcol { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.pcol > h3 { margin: 0; font: 700 17px var(--f-tit); display: flex; gap: 8px; align-items: center; }
.pcol > h3 .qtd { background: var(--ink); color: var(--bg); border-radius: 999px; padding: 1px 8px; font-size: 13px; }
.pvazio { color: var(--muted); font-size: 14px; border: 1px dashed var(--line); border-radius: 10px; padding: 10px; }
.mold { border: 2px dashed var(--c, var(--line)); border-radius: 12px; padding: 7px; background: var(--card); display: grid; gap: 7px; min-width: 0; }
.mold.fixo, .mold.rua { border-style: solid; }
.mold.fixo > header, .mold.rua > header { background: color-mix(in srgb, var(--c) 14%, transparent); border-radius: 8px; padding: 3px 6px; }
.mold.sem, .mold.trava { --c: var(--line); }
.mold.trava { border-style: solid; background: var(--soft); }
.mold > header { display: flex; align-items: center; gap: 3px 7px; flex-wrap: wrap; font-size: 14px; }
.mold > header b { font: 700 17px var(--f-tit); }
.mold > header .q { color: var(--muted); }
.mold > header .q.late { color: var(--late); font-weight: 700; }
.mold > header .ja { background: var(--ok); color: var(--card); font-weight: 800; letter-spacing: .03em; border-radius: 6px; padding: 1px 7px; font-size: 13px; }

async function cadastrar(bruto) {
  const nome = String(bruto || "").trim().split(/\s+/)[0] || "";
  if (!/^[A-Za-zÀ-ÿ']{2,30}$/.test(nome)) { aviso("Escreva uma palavra só: o primeiro nome ou o apelido."); return; }
  const certo = nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase();
  if (!db) { aviso("Sem conexão com o claude.ai: não cadastrei."); return; }
  try { await db.collection("motoboys").doc(slug(certo)).set({nome: certo, criado: Date.now()}); aviso(`${certo} cadastrado.`); if ($("novo")) $("novo").value = ""; }
  catch (e) { aviso("Não deu para cadastrar: esta conta pode só ver. Peça ao Ricardo acesso para mexer."); }
}
async function descadastrar(id) {
  if (!db) return;
  try { await db.collection("motoboys").doc(id).delete(); aviso("Apagado do cadastro."); }
  catch (e) { aviso("Não deu para apagar: esta conta pode só ver."); }
}
let ultimoCriado = 0;  // eventos em sequência saem em ordem (o agente aplica pelo "criado")
async function manda(ev, msg) { return mandaVarios([ev], msg); }
async function mandaVarios(evs, msg) {
  if (!db) { aviso("Sem conexão com o claude.ai: não anotei."); return; }
  try {
    for (const ev of evs) {
      ultimoCriado = Math.max(Date.now(), ultimoCriado + 1);
      await db.collection("eventos").add({...ev, hora: hhmm(), criado: ultimoCriado});
    }
    aviso((msg ? msg + " " : "Anotado. ") + "Entra na próxima rodada.");
  } catch (e) {
    aviso(e && (e.code === "not_granted" || e.code === "permission_denied") ? "Esta conta não pode anotar. Peça ao Ricardo acesso para mexer." : "Não deu para anotar. Tente de novo.");
  }
}
document.addEventListener("click", (e) => {
  const pin = e.target.closest && e.target.closest("[data-pin]");
  if (pin) { if (!semCliqueMapa) { mapaSel = mapaSel === pin.dataset.pin ? "" : pin.dataset.pin; montar(); } return; }
  const vai = e.target.closest && e.target.closest("[data-vai]");
  if (vai) { selQ = vai.dataset.vai; location.hash = "#quadro"; return; }
  const b = e.target.closest("button");
  const cq = !b && e.target.closest(".cartao[data-ref]");
  if (cq) { if (!semClique) { selQ = selQ === cq.dataset.ref ? "" : cq.dataset.ref; montar(); } return; }
  if (!b) return;
  if (b.dataset.mover !== undefined) { const ref = selQ; selQ = ""; if (b.dataset.mover) mover(ref, b.dataset.mover); montar(); return; }
  if (b.dataset.usar) { mandaVarios([{tipo: "fixar", moto: b.dataset.usar, pedidos: JSON.parse(b.dataset.refs)}], `Sugestão do ${b.dataset.usar} fixada.`); return; }
  if (b.dataset.foco !== undefined) { mapaFoco = b.dataset.foco; mapaSel = ""; montar(); return; }
  if (b.dataset.limpar !== undefined) {  // 14/11: "Limpar rotas" esconde as saídas que já estão na rua; "Mostrar" devolve
    const ids = b.dataset.limpar === "1" ? [...new Set([...mapaLimpo.ids, ...(Array.isArray(D.rua) ? D.rua : []).map(chaveRua)])] : [];
    mapaLimpo = {dia: D.dia, ids}; guardaLimpo(); mapaSel = ""; mapaFoco = ""; montar(); return; }
  if (b.dataset.zoom) { const z = b.dataset.zoom;
    if ((z === "mais" || z === "menos") && vistaAtual) { mapaView = {...vistaAtual, k: vistaAtual.k * (z === "mais" ? 1.5 : 1 / 1.5)}; mapaVista = "livre"; }
    else if (z === "pedidos" || z === "loja") { mapaVista = z; mapaView = null; }
    montar(); return; }
  if (b.id === "cadastrar") { cadastrar($("novo") && $("novo").value); return; }
  if (b.dataset.cadastrar) { cadastrar(b.dataset.cadastrar); return; }
  if (b.dataset.um) { manda(JSON.parse(b.dataset.ev)); return; }
  if (!b.dataset.chave) return;
  if (armado && armado.chave === b.dataset.chave && Date.now() < armado.ate) {
    armado = null;
    const ev = JSON.parse(b.dataset.ev);
    if (ev.acao === "descadastrar") descadastrar(ev.id); else manda(ev);
    montar(); return;
  }
  armado = {chave: b.dataset.chave, ate: Date.now() + 5000};
  montar();
  setTimeout(() => { if (armado && Date.now() >= armado.ate) { armado = null; montar(); } }, 5100);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target && e.target.id === "novo") cadastrar(e.target.value);
  if ((e.key === "Enter" || e.key === " ") && e.target && e.target.dataset && (e.target.dataset.pin || e.target.dataset.ref || e.target.dataset.vai)) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", {bubbles: true})); }
  if (e.key === "Escape" && selQ) { selQ = ""; montar(); }
});
let medida = null;
window.addEventListener("resize", () => { clearTimeout(medida); medida = setTimeout(() => { if (aba() === "mapa") montar(); }, 200); });
document.addEventListener("change", (e) => { const s = e.target; if (s && s.dataset && s.dataset.codigo) { escolha[s.dataset.codigo] = s.value; armado = null; montar(); } });
window.addEventListener("hashchange", () => { armado = null; montar(); window.scrollTo(0, 0); });

(async () => {
  const c = window.claude;
  db = c && c.use ? await c.use("db") : null;
  if (!db) { db = false; montar(); return; }
  const espera = setTimeout(() => { if (!carregou) { semRede = true; montar(); } }, 10000);
  db.doc("painel/atual").onSnapshot((s) => {
    if (!s.metadata.fromCache) { carregou = true; semRede = false; clearTimeout(espera); }
    D = s.exists ? s.data() : null; montar();
  }, () => { clearTimeout(espera); semRede = true; montar(); });
  db.collection("eventos").orderBy("criado", "desc").limit(30).onSnapshot((q) => {
    eventos = q.docs.map((d) => d.data()); montar();
  }, () => {});
  db.collection("motoboys").onSnapshot((q) => {
    cadastro = q.docs.map((d) => ({id: d.id, nome: String((d.data() || {}).nome || d.id)})); montar();
  }, () => {});
})();
setInterval(() => { if (D && !D.replay) montar(); }, 60000);  // atualiza o aviso de "não atualiza há X min"
</script>
